---
# Install an explicit 32-bit Vulkan provider before Steam. Otherwise pacman can
# select an unsuitable provider when resolving Steam's lib32-vulkan-driver dependency.
- name: Install Intel Vulkan userspace
  ansible.builtin.command:
    argv:
      - pacman
      - --sync
      - --needed
      - --noconfirm
      - lib32-vulkan-intel
      - vulkan-intel
  register: intel_gaming_packages
  changed_when: "'there is nothing to do' not in (intel_gaming_packages.stdout + intel_gaming_packages.stderr) | lower"
  when:
    - not packages_preinstalled | bool
    - gpu_vendor == 'intel'

- name: Install AMD Vulkan userspace
  ansible.builtin.command:
    argv:
      - pacman
      - --sync
      - --needed
      - --noconfirm
      - lib32-vulkan-radeon
      - vulkan-radeon
  register: amd_gaming_packages
  changed_when: "'there is nothing to do' not in (amd_gaming_packages.stdout + amd_gaming_packages.stderr) | lower"
  when:
    - not packages_preinstalled | bool
    - gpu_vendor == 'amd'

- name: Install common Steam gaming userspace
  ansible.builtin.command:
    argv:
      - pacman
      - --sync
      - --needed
      - --noconfirm
      - gamemode
      - lib32-gamemode
      - lib32-libpulse
      - lib32-mesa
      - mangohud
      - steam
      - vulkan-tools
  register: gaming_packages
  changed_when: "'there is nothing to do' not in (gaming_packages.stdout + gaming_packages.stderr) | lower"
  when: not packages_preinstalled | bool
