---
- name: Install development toolchain
  ansible.builtin.command:
    argv: "{{ ['pacman', '--sync', '--needed', '--noconfirm'] + lookup('ansible.builtin.pipe', 'bash ' ~ ((workstation_repo_root ~ '/scripts/package-list.sh') | quote) ~ ' development').splitlines() }}"
  register: development_packages
  changed_when: "'there is nothing to do' not in (development_packages.stdout + development_packages.stderr) | lower"

- name: Create the .NET NuGet directory
  ansible.builtin.file:
    path: "/home/{{ arch_user }}/.nuget/packages"
    state: directory
    owner: "{{ arch_user }}"
    group: "{{ arch_user }}"
    mode: '0755'
